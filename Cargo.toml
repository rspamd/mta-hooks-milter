[package]
name = "mta-hooks-milter"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Tokio milter state machine and Postfix to MTA Hooks bridge"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/rspamd/mta-hooks-milter"
keywords = ["milter", "postfix", "smtp", "tokio", "mta-hooks"]
categories = ["email", "asynchronous", "network-programming"]
include = [
    "Cargo.toml", "Cargo.lock", "src/**", "tests/**", "examples/**",
    "README.md", "LICENSE.md", "NOTICE", "CHANGELOG.md", "CONTRIBUTING.md",
    "SECURITY.md", "RELEASING.md", "interop/README.md",
    "interop/Dockerfile", "interop/postfix_test.py", ".dockerignore",
    "scripts/check_package.py",
]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[dependencies]
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
